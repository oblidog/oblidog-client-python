[project]
name = "oblidog-client"
version = "0.2.0"
description = "Python client for the Oblidog integration API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Oblidog contributors" },
]
maintainers = [
  { name = "wini83" },
]
keywords = ["oblidog", "integration", "openapi", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "attrs>=23.0",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/oblidog/oblidog-client-python"
Documentation = "https://oblidog.github.io/oblidog-client-python/"
Repository = "https://github.com/oblidog/oblidog-client-python"
Issues = "https://github.com/oblidog/oblidog-client-python/issues"
Changelog = "https://github.com/oblidog/oblidog-client-python/releases"

[dependency-groups]
dev = [
  "commitizen>=4.18.0",
  "openapi-python-client>=0.25",
  "packaging>=24",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=6.1",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_client"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["src/oblidog_client/generated"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
annotated_tag = true
