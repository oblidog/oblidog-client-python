[project]
name = "oblidog-client"
version = "0.1.0"
description = "Python client for the Oblidog integration API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Oblidog contributors" },
]
maintainers = [
  { name = "wini83" },
]
keywords = ["oblidog", "integration", "openapi", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "attrs>=23.0",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/oblidog/oblidog-client-python"
Documentation = "https://github.com/oblidog/oblidog-client-python#readme"
Repository = "https://github.com/oblidog/oblidog-client-python"
Issues = "https://github.com/oblidog/oblidog-client-python/issues"
Changelog = "https://github.com/oblidog/oblidog-client-python/releases"

[dependency-groups]
dev = [
  "openapi-python-client>=0.25",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oblidog_client"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["src/oblidog_client/generated"]

[tool.pytest.ini_options]
pythonpath = ["src"]
