name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q

      - name: Compile package
        run: python -m compileall -q src/findog_client

      - name: Build package
        run: uv build

      - name: Verify wheel installation
        run: |
          uv venv "$RUNNER_TEMP/wheel-test-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-test-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-test-venv/bin/python" -c "from findog_client import FindogClient"
